# ==========================================================================
#  Aton — example description  (belongs in /config/aton.yaml)
#
#  Everything Aton draws comes from this one file. It is meant to be read and
#  edited by a human; the built-in configurator writes it back without touching
#  your comments, so both ways of working stay open to you.
#
#  This example is a complete, working setup for two panels. Copy it, change the
#  hosts and entity IDs, and you have something on screen.
#
#  Full reference:  docs/yaml-reference.md
#  Guided tour:     docs/getting-started.md
# ==========================================================================

# --------------------------------------------------------------------------
#  Defaults apply to every panel unless a panel says otherwise.
# --------------------------------------------------------------------------
defaults:
  font: 5x3            # narrow 5x3 pixel font; try spleen-5x8 for something softer
  color: ffffff
  interval: 5          # seconds between frames — one "cycle"

panels:

  # ========================================================================
  #  A 128x64 panel in the living room
  # ========================================================================
  - id: living_room
    name: Living room matrix
    host: 192.168.1.50           # the WLED device
    size: [128, 64]

    # ⚠ Start in dry-run: Aton computes the image and shows it in the preview,
    # but sends nothing. Look at the preview first, then set this to false.
    # Keep it true whenever a second renderer drives the same panel — two
    # writers on one surface produce a mixed picture.
    dry_run: true

    # The grid turns "row and column" into pixels, so widgets can say
    # `cell: [0, 1]` instead of counting pixels.
    grid:
      row_height: 9      # 8 px of content plus 1 px of air
      col_width: 32      # 128 px wide / 4 columns
      icon_width: 8      # left part of a cell holds the icon
      gap: 1

    # The gate decides whether Aton draws at all. Point it at whatever really
    # switches the panel — usually WLED's master switch.
    gate:
      entity: light.matrix_power
      # A `fallback:` entity can be added here for the case where the gate entity
      # disappears — see docs/yaml-reference.md, it matters for WLED. It is left out
      # on purpose in this example: with a fallback, an entity that does not exist
      # counts as "off" and nothing is drawn at all. Without one, an unusable gate
      # falls back to drawing, so this file shows something the moment you copy it.

    # Without an entity the brightness lives in memory only and is lost on
    # restart. An input_number keeps it, and makes it automatable in HA.
    brightness:
      entity: input_number.matrix_brightness
      default: 128

    # ----------------------------------------------------------------
    #  Base image — always visible, behind everything else
    # ----------------------------------------------------------------
    widgets:
      # Row 0: outdoor conditions.
      # A tile is icon + value. `format` is a Python format string.
      - cell: [0, 0]
        icon: temp_o
        value: sensor.outdoor_temperature
        format: "{:.1f}°C"
      - cell: [0, 1]
        icon: hum_o
        value: sensor.outdoor_humidity
        format: "{:.0f}%"
      - cell: [0, 2]
        icon: lux
        value: sensor.outdoor_illuminance
        scale: 0.001        # lux -> klx
        decimals: 1
      - cell: [0, 3]
        # The icon may come from a state: `map` for exact matches …
        icon:
          value: binary_sensor.rain
          map: {"off": dry, "on": wet}
          default: dry
        value: sensor.rain_rate
        decimals: 1

      # Row 1: indoors and wind.
      - cell: [1, 0]
        icon: temp_i
        value: sensor.living_room_temperature
        format: "{:.1f}°C"
      - cell: [1, 1]
        icon: hum_i
        value: sensor.living_room_humidity
        format: "{:.0f}%"
      - cell: [1, 2]
        icon: wind
        value: sensor.wind_speed
        decimals: 1
      - cell: [1, 3]
        # … and `steps` for thresholds: the first step at or below the value wins.
        icon:
          value: sensor.wind_bearing
          steps: {337.5: wind_n, 292.5: wind_nw, 247.5: wind_w, 202.5: wind_sw,
                  157.5: wind_s, 112.5: wind_so, 67.5: wind_o, 22.5: wind_no,
                  0: wind_n}
          default: wind_n
        # `template` renders Jinja, exactly like in Home Assistant.
        template: >-
          {% set d = states('sensor.wind_bearing') | float(0) %}
          {% if d < 45 %}N{% elif d < 135 %}E{% elif d < 225 %}S
          {%- elif d < 315 %}W{% else %}N{% endif %}

      # Row 2: household power. The meter reading gets a wider text field,
      # because nothing sits next to it.
      - cell: [2, 0]
        icon: power
        value: sensor.house_power
        format: "{:.0f}W"
      - cell: [2, 1]
        icon: power_total
        value: sensor.house_energy_total
        decimals: 1
        text_at: [41, 21]
        text_width: 55

      # A free-standing text whose colour follows a state — this is how a field
      # turns red when something needs attention.
      - type: text
        at: [0, 54]
        size: [60, 8]
        template: >-
          {% if is_state('binary_sensor.window_open', 'on') %}WINDOW
          {%- else %}All closed{% endif %}
        color:
          template: >-
            {% if is_state('binary_sensor.window_open', 'on') %}ff3030
            {%- else %}30c030{% endif %}

      - type: calendar
        at: [96, 54]
        size: [9, 8]
      - type: clock_wd
        at: [105, 54]
        size: [23, 8]

      # --------------------------------------------------------------
      #  Notifications arrive through the `aton.notify` service and appear
      #  in this strip. It stays empty while nothing is pending; longer text
      #  scrolls as WLED marquee text.
      #
      #  `layer: 1` is not optional here: tiles are drawn in list order, and
      #  the screen group below covers the same rows. On layer 0 the message
      #  would be painted over.
      # --------------------------------------------------------------
      - type: notify
        at: [0, 45]
        size: [128, 8]
        layer: 1
        max_bar_chars: 30
        max_chars: 60

      # A second line, for warnings only. `aton.notify` reaches it with
      # `channel: warnings` — everything without a channel stays above.
      - type: notify
        at: [0, 36]
        size: [128, 8]
        layer: 1
        channel: warnings
        show_levels: warning

    # ----------------------------------------------------------------
    #  Screen groups: an area of the image whose content changes.
    #
    #  Each group becomes a `select` entity in Home Assistant, so you can
    #  switch it by hand or from an automation. "Automatic" means: the first
    #  screen whose `when` is true wins.
    # ----------------------------------------------------------------
    screen_groups:
      - id: fields
        name: Fields
        region: [0, 27, 128, 18]      # x, y, width, height
        screens:

          - name: Solar
            when: "{{ states('sensor.solar_power') | float(0) > 0 }}"
            # This screen has two PAGES. Pages alternate on their own, while the
            # selection in HA still shows just "Solar" — that is what separates
            # them from two screens, where picking one by hand would stop the
            # rotation.
            page_cycles: 2          # master switch, and the default per page
            pages:
              - name: Production
                cycles: 2              # stays twice as long as the other page
                widgets:
                  - cell: [3, 0]
                    icon: power_solar
                    value: sensor.solar_power
                    format: "{:.0f}W"
                  - cell: [3, 1]
                    icon: sol_o
                    value: sensor.solar_to_house
                    format: "{:.0f}W"
                  - cell: [3, 2]
                    icon: sol_i
                    value: sensor.solar_to_battery
                    format: "{:.0f}W"
                  - cell: [3, 3]
                    icon:
                      value: sensor.battery_level
                      steps: {100: power_battery_100, 83: power_battery_83,
                              67: power_battery_67, 50: power_battery_50,
                              33: power_battery_33, 17: power_battery_17,
                              0: power_battery_0}
                      default: power_battery_0
                    template: "{{ states('sensor.battery_level') }}%"

              - name: Strings
                cycles: 1              # half as long as "Production"
                widgets:
                  - cell: [3, 0]
                    icon: p1
                    value: sensor.solar_string_1
                    format: "{:.0f}W"
                  - cell: [3, 1]
                    icon: p2
                    value: sensor.solar_string_2
                    format: "{:.0f}W"

          - name: Rooms
            when: always               # fallback when no condition matches
            widgets:
              - cell: [3, 0]
                icon: r_liv
                value: sensor.living_room_temperature
                format: "{:.1f}°C"
              - cell: [3, 1]
                icon: r_kit
                value: sensor.kitchen_temperature
                format: "{:.1f}°C"
              - cell: [3, 2]
                icon: r_sle
                value: sensor.bedroom_temperature
                format: "{:.1f}°C"
              - cell: [3, 3]
                icon: r_bat
                value: sensor.bathroom_temperature
                format: "{:.1f}°C"


  # ========================================================================
  #  A small 32x16 panel by the front door — the minimum that makes sense
  # ========================================================================
  - id: hallway
    name: Hallway matrix
    host: 192.168.1.51
    size: [32, 16]
    dry_run: true
    interval: 5

    gate:
      entity: light.hallway_matrix_power

    widgets:
      - type: clock_wd
        at: [0, 0]
        size: [32, 8]
      - type: text
        at: [0, 8]
        size: [32, 8]
        # ⚠ `| float(0)` first: an entity that is missing or unavailable gives you the
        # STRING "unknown", and `round()` on a string raises. Filter first, round second
        # — this is the single most common mistake in a description.
        template: "{{ states('sensor.outdoor_temperature') | float(0) | round(0) }}°"
